version: '3.8'

services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - /Users/martindelarminat/Documents/Datasets/MovieLens:/app/data
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
  
  worker:
    build: ./backend
    container_name: celery-worker
    command: celery -A backend worker -l info
    depends_on:
      - redis
      - backend
      - db
    env_file:
      - ./.env
  
  beat:
    build: ./backend
    container_name: celery-beat
    command: celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - backend
      - db
    env_file:
      - ./.env
  
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
  
  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=mcdelarm
      - POSTGRES_PASSWORD=Barcelona1@
      - POSTGRES_DB=streamhelp_db
    volumes:
      - postgres_data:/var/lib/postgresql
    ports: 
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    stdin_open: true
    command: ["npm", "run", "start"]

volumes:
  postgres_data:
  node_modules: